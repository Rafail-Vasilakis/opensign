<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSign Studio — Drag & Drop Signature Field Placement</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Mozilla PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <link rel="stylesheet" href="/styles.css">
  <style>
    .field-badge {
      position: absolute;
      user-select: none;
      cursor: move;
      transition: box-shadow 0.15s ease;
    }
    .field-badge:hover {
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }
    #pdf-container {
      position: relative;
    }
    .page-layer {
      position: relative;
      margin: 0 auto 24px auto;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      background: white;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col font-['Inter'] antialiased select-none">

  <!-- Top Studio Navigation Bar -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm h-16 flex items-center justify-between px-6">
    <div class="flex items-center space-x-3">
      <a href="/" class="p-1.5 rounded-lg text-slate-500 hover:text-slate-800 hover:bg-slate-100 transition-colors" title="Back to Dashboard">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
      </a>
      <div>
        <h1 id="studio-doc-title" class="font-bold text-sm text-slate-900">Custom Document Preparation</h1>
        <p class="text-[11px] text-slate-500">Drag fields from the left onto the PDF page</p>
      </div>
    </div>

    <!-- Page navigation controls & actions -->
    <div class="flex items-center space-x-4">
      <div class="flex items-center space-x-2 bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 text-xs text-slate-600">
        <span id="page-indicator">Loading Pages...</span>
        <select id="active-page-select" onchange="setActivePage(parseInt(this.value))" class="bg-white border border-slate-300 rounded px-2 py-0.5 text-xs font-semibold focus:ring-1 focus:ring-indigo-500">
          <option value="1">Page 1</option>
        </select>
      </div>

      <button onclick="saveAndSendEnvelope()" class="inline-flex items-center px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold shadow-sm transition-colors">
        <i data-lucide="send" class="w-4 h-4 mr-1.5"></i>
        Send Envelope
      </button>
    </div>
  </header>

  <!-- Studio Main Layout -->
  <div class="flex-1 flex overflow-hidden">

    <!-- LEFT SIDEBAR: FIELD TOOLBOX -->
    <aside class="w-72 bg-white border-r border-slate-200 p-5 flex flex-col space-y-6 overflow-y-auto">
      <div>
        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Assign Fields To</label>
        <select id="selected-signer-select" class="w-full border border-slate-300 rounded-lg p-2.5 text-xs font-semibold focus:ring-2 focus:ring-indigo-500 focus:outline-none">
          <!-- Populated with signers -->
        </select>
      </div>

      <div>
        <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-3">Field Palette (Click to Add)</p>
        <div class="space-y-2">
          <!-- Signature Field Button -->
          <button onclick="addField('signature')" class="w-full flex items-center p-2.5 rounded-xl border border-amber-300 bg-amber-50 hover:bg-amber-100 text-amber-900 text-xs font-bold transition-all text-left shadow-sm">
            <div class="w-7 h-7 rounded-lg bg-amber-200 text-amber-800 flex items-center justify-center mr-2.5">
              <i data-lucide="pen-tool" class="w-3.5 h-3.5"></i>
            </div>
            <div>
              <p>Signature Box</p>
              <p class="text-[10px] text-amber-700 font-normal">Drawn or typed legal signature</p>
            </div>
          </button>

          <!-- Initials Field Button -->
          <button onclick="addField('initials')" class="w-full flex items-center p-2.5 rounded-xl border border-purple-300 bg-purple-50 hover:bg-purple-100 text-purple-900 text-xs font-bold transition-all text-left shadow-sm">
            <div class="w-7 h-7 rounded-lg bg-purple-200 text-purple-800 flex items-center justify-center mr-2.5">
              <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
            </div>
            <div>
              <p>Initials</p>
              <p class="text-[10px] text-purple-700 font-normal">Compact initials tag</p>
            </div>
          </button>

          <!-- Date Field Button -->
          <button onclick="addField('date')" class="w-full flex items-center p-2.5 rounded-xl border border-blue-200 bg-blue-50 hover:bg-blue-100 text-blue-900 text-xs font-bold transition-all text-left shadow-sm">
            <div class="w-7 h-7 rounded-lg bg-blue-200 text-blue-800 flex items-center justify-center mr-2.5">
              <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
            </div>
            <div>
              <p>Date Signed</p>
              <p class="text-[10px] text-blue-700 font-normal">Auto-stamped date of execution</p>
            </div>
          </button>

          <!-- Full Name Field Button -->
          <button onclick="addField('name')" class="w-full flex items-center p-2.5 rounded-xl border border-emerald-200 bg-emerald-50 hover:bg-emerald-100 text-emerald-900 text-xs font-bold transition-all text-left shadow-sm">
            <div class="w-7 h-7 rounded-lg bg-emerald-200 text-emerald-800 flex items-center justify-center mr-2.5">
              <i data-lucide="user" class="w-3.5 h-3.5"></i>
            </div>
            <div>
              <p>Signer Full Name</p>
              <p class="text-[10px] text-emerald-700 font-normal">Printed legal name</p>
            </div>
          </button>

          <!-- Text Box Field Button -->
          <button onclick="addField('text')" class="w-full flex items-center p-2.5 rounded-xl border border-indigo-200 bg-indigo-50 hover:bg-indigo-100 text-indigo-900 text-xs font-bold transition-all text-left shadow-sm">
            <div class="w-7 h-7 rounded-lg bg-indigo-200 text-indigo-800 flex items-center justify-center mr-2.5">
              <i data-lucide="type" class="w-3.5 h-3.5"></i>
            </div>
            <div>
              <p>Text Box</p>
              <p class="text-[10px] text-indigo-700 font-normal">Fillable text entry field</p>
            </div>
          </button>

          <!-- Checkbox Field Button -->
          <button onclick="addField('checkbox')" class="w-full flex items-center p-2.5 rounded-xl border border-teal-200 bg-teal-50 hover:bg-teal-100 text-teal-900 text-xs font-bold transition-all text-left shadow-sm">
            <div class="w-7 h-7 rounded-lg bg-teal-200 text-teal-800 flex items-center justify-center mr-2.5">
              <i data-lucide="check-square" class="w-3.5 h-3.5"></i>
            </div>
            <div>
              <p>Checkbox</p>
              <p class="text-[10px] text-teal-700 font-normal">Interactive checkable box</p>
            </div>
          </button>
        </div>
      </div>

      <!-- Placed Fields List -->
      <div class="pt-4 border-t border-slate-200 flex-1">
        <p class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Placed Fields (<span id="fields-count">0</span>)</p>
        <div id="placed-fields-list" class="space-y-2 text-xs text-slate-500">
          <p class="text-[11px] text-slate-400 italic">No fields placed yet. Click a field above to drop it on the PDF.</p>
        </div>
      </div>
    </aside>

    <!-- CENTER WORKSPACE: PDF VIEWER & DRAG CANVAS -->
    <main class="flex-1 bg-slate-200/70 overflow-y-auto p-8 flex justify-center">
      <div id="pdf-pages-container" class="max-w-4xl w-full flex flex-col items-center">
        <!-- Rendered PDF Pages will be appended here -->
      </div>
    </main>

  </div>

  <script src="/studio.js"></script>
</body>
</html>
