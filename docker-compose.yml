version: '3.8'

services:
  opensign:
    build: .
    container_name: opensign_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BASE_URL=http://localhost:3000
      # Optional: SMTP for real email delivery (works with Gmail, Sendgrid, Resend, Amazon SES, etc.)
      # - SMTP_HOST=smtp.example.com
      # - SMTP_PORT=587
      # - SMTP_USER=your-smtp-user
      # - SMTP_PASS=your-smtp-password
      # - SMTP_FROM="OpenSign" <no-reply@yourdomain.com>
